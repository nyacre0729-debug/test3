services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vacancy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./make_table.sql:/docker-entrypoint-initdb.d/0_init.sql

  app:
    build: .
    depends_on:
      - db
    volumes:
      - ./:/app
      - ./figures:/app/figures
      - ./results:/app/results

volumes:
  pgdata:
